<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laporan Keuangan LPK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid px-3">
            <span class="navbar-brand fw-bold small"><i class="bi bi-wallet2 me-2"></i>MONITORING KEUANGAN LPK</span>
            <button class="btn btn-sm btn-outline-light" onclick="segarkanSemuaData()"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
    </nav>

    <div class="container-fluid px-3">
        <!-- RINGKASAN DASHBOARD -->
        <div class="row mb-4 text-white">
            <div class="col-6 col-md-4 mb-2"><div class="card bg-success p-3 border-0 shadow-sm card-sm">Pemasukan<h4 class="fw-bold m-0" id="txt-pemasukan">Memuat...</h4></div></div>
            <div class="col-6 col-md-4 mb-2"><div class="card bg-danger p-3 border-0 shadow-sm card-sm">Pengeluaran<h4 class="fw-bold m-0" id="txt-pengeluaran">Memuat...</h4></div></div>
            <div class="col-12 col-md-4 mb-2"><div class="card bg-primary p-3 border-0 shadow-sm card-sm">Saldo Kas LPK<h4 class="fw-bold m-0" id="txt-saldo">Memuat...</h4></div></div>
        </div>

        <!-- NAV TAB -->
        <ul class="nav nav-tabs mb-3" id="tabsLaporan" role="tablist">
            <li class="nav-item"><button class="nav-link active fw-bold small" id="rekap-tab" data-bs-toggle="tab" data-bs-target="#tab-rekap" type="button">Rekapitulasi</button></li>
            <li class="nav-item"><button class="nav-link fw-bold small" id="jurnal-tab" data-bs-toggle="tab" data-bs-target="#tab-jurnal" type="button">Jurnal Akuntansi</button></li>
        </ul>

        <div class="tab-content">
            <!-- TAB REKAP -->
            <div class="tab-pane fade show active" id="tab-rekap">
                <div class="card p-3 border-0 shadow-sm bg-white mb-5">
                    <div class="row g-1 mb-2 p-1 bg-light rounded">
                        <div class="col-4"><select class="form-select form-select-sm" id="f-jenis" onchange="filterTabel()"><option value="Semua">Semua</option><option value="Pemasukan">Masuk</option><option value="Pengeluaran">Keluar</option></select></div>
                        <div class="col-8"><input type="text" class="form-control form-control-sm" id="f-cari" onkeyup="filterTabel()" placeholder="Cari..."></div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm table-hover text-sm align-middle">
                            <thead class="table-light">
                              <tr>
                                <th>No</th><th>Tanggal</th><th>No.Ref</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th class="text-end">Jumlah</th>
                               </tr>
                            </thead>
                            <tbody id="tabel-body"><tr><td colspan="7" class="text-center py-3">Memuat...</td></tr></tbody>
                            <tfoot class="table-dark" id="tabel-foot"></tfoot>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TAB JURNAL -->
            <div class="tab-pane fade" id="tab-jurnal">
                <div class="card p-3 border-0 shadow-sm bg-white mb-5">
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered text-sm align-middle">
                            <thead class="table-secondary text-center">
                                <tr><th>Tanggal</th><th>No. Ref</th><th>Keterangan Akun</th><th class="text-end">Debit</th><th class="text-end">Kredit</th></tr>
                            </thead>
                            <tbody id="jurnal-body"><tr><td colspan="5" class="text-center py-3">Memuat Jurnal...</td></tr></tbody>
                            <tfoot class="table-light fw-bold" id="jurnal-foot"></tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycbz4OcrI2bPpCn9I8o9kglApgptnTrsx9XfQWfQVD29LwfQt00Jkba0hlz80uxuQsnXG/exec"; 
        var masterData = [];

        window.onload = function() { segarkanSemuaData(); };

        async function panggilAPI(param) {
            try {
                const respons = await fetch(API_URL + "?" + param);
                return await respons.json();
            } catch (err) { return null; }
        }

        async function segarkanSemuaData() {
            const d = await panggilAPI("aksi=getRingkasan");
            if (d) {
                document.getElementById('txt-pemasukan').innerText = formatRupiah(d.pemasukan);
                document.getElementById('txt-pengeluaran').innerText = formatRupiah(d.pengeluaran);
                document.getElementById('txt-saldo').innerText = formatRupiah(d.saldo);
            }
            const data = await panggilAPI("aksi=ambilData");
            if (data) {
                masterData = data;
                renderTabel(masterData);
                renderJurnal(masterData);
            }
        }

       function renderTabel(arr) {
            var tbody = document.getElementById("tabel-body"); 
            var tfoot = document.getElementById("tabel-foot");
            if(!tbody) return;
            tbody.innerHTML = ""; if(tfoot) tfoot.innerHTML = "";
            
            if(!arr || arr.length === 0) { 
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-3 text-muted">Data kosong.</td></tr>`; 
                return; 
            }
            
            var akumulasiTotal = 0; 
            var filterJenisSaatIni = document.getElementById("f-jenis") ? document.getElementById("f-jenis").value : "Semua";
            var nomorUrut = 1;

            arr.forEach(function(item) {
                if (filterJenisSaatIni !== "Semua" && item.jenis !== filterJenisSaatIni) return;
                
                var isM = item.jenis === 'Pemasukan';
                if (filterJenisSaatIni === "Semua") { if (isM) { akumulasiTotal += item.jumlah; } else { akumulasiTotal -= item.jumlah; } } else { akumulasiTotal += item.jumlah; }
                
                var tglIndo = new Date(item.tanggalForm).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                var tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${nomorUrut++}</td>
                    <td style="white-space:nowrap">${tglIndo}</td>
                    <td class="fw-bold text-muted">${item.noref || "-"}</td>
                    <td><span class="badge ${isM ? 'bg-success':'bg-danger'}">${item.jenis === "Pemasukan" ? "Masuk":"Keluar"}</span></td>
                    <td><b>${item.kategori}</b></td>
                    <td>${item.keterangan}</td>
                    <td class="text-end fw-bold ${isM ? 'text-success':'text-danger'}">${formatRupiah(item.jumlah)}</td>
                `;
                tbody.appendChild(tr);
            });
            
            if(tfoot) {
                var labelTotal = "TOTAL SALDO AKHIR :";
                if (filterJenisSaatIni === "Pemasukan") labelTotal = "TOTAL PEMASUKAN :";
                if (filterJenisSaatIni === "Pengeluaran") labelTotal = "TOTAL PENGELUARAN :";
                // colspan="6" karena tidak ada kolom aksi di viewer
                tfoot.innerHTML = `<tr><td colspan="6" class="fw-bold text-end">${labelTotal}</td><td class="text-end fw-bold text-warning">${formatRupiah(akumulasiTotal)}</td></tr>`;
            }
        }

        function renderJurnal(arr) {
            var jbody = document.getElementById("jurnal-body"); var jfoot = document.getElementById("jurnal-foot");
            jbody.innerHTML = ""; jfoot.innerHTML = "";
            if(!arr || arr.length === 0) return;
            var totalDebit = 0; var totalKredit = 0;
            arr.forEach(function(item) {
                var tglIndo = new Date(item.tanggalForm).toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' });
                var trKas = document.createElement("tr"); var trLawan = document.createElement("tr");
                if (item.jenis === "Pemasukan") {
                    totalDebit += item.jumlah; totalKredit += item.jumlah;
                    trKas.innerHTML = `<td>${tglIndo}</td><td>${item.noref}</td><td>Kas LPK Kas Utama</td><td class="text-end">${formatRupiah(item.jumlah)}</td><td class="text-end">-</td>`;
                    trLawan.innerHTML = `<td></td><td></td><td style="padding-left:25px;" class="text-muted">Pendapatan LPK</td><td class="text-end">-</td><td class="text-end">${formatRupiah(item.jumlah)}</td>`;
                } else {
                    totalDebit += item.jumlah; totalKredit += item.jumlah;
                    trKas.innerHTML = `<td>${tglIndo}</td><td>${item.noref}</td><td>Beban Operasional</td><td class="text-end">${formatRupiah(item.jumlah)}</td><td class="text-end">-</td>`;
                    trLawan.innerHTML = `<td></td><td></td><td style="padding-left:25px;" class="text-muted">Kas LPK Kas Utama</td><td class="text-end">-</td><td class="text-end">${formatRupiah(item.jumlah)}</td>`;
                }
                jbody.appendChild(trKas); jbody.appendChild(trLawan);
            });
            jfoot.innerHTML = `<tr><td colspan="3" class="text-center">TOTAL BALANCE</td><td class="text-end text-success">${formatRupiah(totalDebit)}</td><td class="text-end text-success">${formatRupiah(totalKredit)}</td></tr>`;
        }

        function filterTabel() {
            var jns = document.getElementById("f-jenis").value; var cari = document.getElementById("f-cari").value.toLowerCase();
            var hasil = masterData.filter(function(item) { return (jns === "Semua" || item.jenis === jns) && (item.keterangan.toLowerCase().includes(cari) || item.kategori.toLowerCase().includes(cari) || item.noref.toLowerCase().includes(cari)); });
            renderTabel(hasil);
        }
        function formatRupiah(n) { return "Rp " + parseFloat(n).toLocaleString('id-ID'); }
    </script>
</body>
</html>
