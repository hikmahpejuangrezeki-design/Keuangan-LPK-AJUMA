<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mode Viewer - Sistem Keuangan LPK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
        @media print {
            nav, .btn, .filter-area { display: none !important; }
            body { background: #fff; color: #000; }
            table { width: 100% !important; border: 1px solid #000; }
            th, td { border: 1px solid #000 !important; padding: 6px !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-secondary shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="bi bi-eye me-2"></i>MONITORING KEUANGAN LPK (VIEW ONLY)</span>
            <span class="badge bg-light text-dark fw-bold">Akses Terbatas</span>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4 text-white">
            <div class="col-md-4 mb-2"><div class="card bg-success p-3 border-0 shadow-sm">Pemasukan<h2 class="fw-bold m-0" id="txt-pemasukan">Memuat...</h2></div></div>
            <div class="col-md-4 mb-2"><div class="card bg-danger p-3 border-0 shadow-sm">Pengeluaran<h2 class="fw-bold m-0" id="txt-pengeluaran">Memuat...</h2></div></div>
            <div class="col-md-4 mb-2"><div class="card bg-primary p-3 border-0 shadow-sm">Saldo Kas LPK<h2 class="fw-bold m-0" id="txt-saldo">Memuat...</h2></div></div>
        </div>

        <div class="card p-4 border-0 shadow-sm bg-white mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0"><i class="bi bi-receipt-cutoff text-primary"></i> Laporan Rekapitulasi Keuangan LPK</h5>
                <button class="btn btn-primary btn-sm fw-bold px-3" onclick="window.print()"><i class="bi bi-printer-fill"></i> Cetak Laporan</button>
            </div>

            <div class="row g-2 mb-3 p-2 bg-light rounded filter-area">
                <div class="col-md-4"><select class="form-select form-select-sm" id="f-jenis" onchange="filterTabel()"><option value="Semua">-- Semua Jenis --</option><option value="Pemasukan">Pemasukan</option><option value="Pengeluaran">Pengeluaran</option></select></div>
                <div class="col-md-8"><input type="text" class="form-control form-control-sm" id="f-cari" onkeyup="filterTabel()" placeholder="Cari keterangan / kategori..."></div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th class="text-end">Jumlah</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-body">
                        <tr><td colspan="5" class="text-center py-4 text-muted">Sedang memuat database Sheets...</td></tr>
                    </tbody>
                    <tfoot class="table-dark" id="tabel-foot"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        // TEMPELKAN URL WEB APP ANDA DI BAWAH INI
        var API_URL = "https://script.google.com/macros/s/AKfycbz4OcrI2bPpCn9I8o9kglApgptnTrsx9XfQWfQVD29LwfQt00Jkba0hlz80uxuQsnXG/exec";
        var masterData = [];

        window.onload = function() { segarkanSemuaData(); };

        function panggilAPI(param, callbackName, callbackFunc) {
            window[callbackName] = function(data) { callbackFunc(data); delete window[callbackName]; document.getElementById(callbackName).remove(); };
            var script = document.createElement('script'); script.id = callbackName;
            script.src = API_URL + "?" + param + "&callback=" + callbackName + "&_ts=" + new Date().getTime();
            document.body.appendChild(script);
        }

        function segarkanSemuaData() {
            panggilAPI("aksi=getRingkasan", "cbDashboard", function(d) {
                document.getElementById('txt-pemasukan').innerText = formatRupiah(d.pemasukan);
                document.getElementById('txt-pengeluaran').innerText = formatRupiah(d.pengeluaran);
                document.getElementById('txt-saldo').innerText = formatRupiah(d.saldo);
            });
            panggilAPI("aksi=ambilData", "cbTabel", function(data) { masterData = data; renderTabel(masterData); });
        }

        function renderTabel(arr) {
            var tbody = document.getElementById("tabel-body"); var tfoot = document.getElementById("tabel-foot");
            tbody.innerHTML = ""; tfoot.innerHTML = "";
            if(!arr || arr.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="text-center py-3 text-muted">Data kosong.</td></tr>`; return; }

            var akumulasiTotal = 0; var filterJenisSaatIni = document.getElementById("f-jenis").value;

            arr.forEach(function(item) {
                var tr = document.createElement("tr"); var isM = item.jenis === 'Pemasukan';
                if (filterJenisSaatIni === "Semua") { if (isM) { akumulasiTotal += item.jumlah; } else { akumulasiTotal -= item.jumlah; } } else { akumulasiTotal += item.jumlah; }

                tr.innerHTML = `<td>${item.tanggal}</td><td><span class="badge ${isM ? 'bg-success':'bg-danger'}">${item.jenis}</span></td><td><b>${item.kategori}</b></td><td>${item.keterangan}</td><td class="text-end fw-bold ${isM ? 'text-success':'text-danger'}">${formatRupiah(item.jumlah)}</td>`;
                tbody.appendChild(tr);
            });

            var labelTotal = "TOTAL SALDO AKHIR";
            if (filterJenisSaatIni === "Pemasukan") labelTotal = "TOTAL PEMASUKAN";
            if (filterJenisSaatIni === "Pengeluaran") labelTotal = "TOTAL PENGELUARAN";
            tfoot.innerHTML = `<tr><td colspan="4" class="fw-bold text-end">${labelTotal} :</td><td class="text-end fw-bold text-warning">${formatRupiah(akumulasiTotal)}</td></tr>`;
        }

        function filterTabel() {
            var jns = document.getElementById("f-jenis").value; var cari = document.getElementById("f-cari").value.toLowerCase();
            var hasil = masterData.filter(function(item) { return (jns === "Semua" || item.jenis === jns) && (item.keterangan.toLowerCase().includes(cari) || item.kategori.toLowerCase().includes(cari)); });
            renderTabel(hasil);
        }

        function formatRupiah(n) { return "Rp " + parseFloat(n).toLocaleString('id-ID'); }
    </script>
</body>
</html>
